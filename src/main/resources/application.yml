spring:
  application:
    name: epcis-event-handler

  datasource:
    url: jdbc:postgresql://localhost:5432/kamiljasinski
    username: kamiljasinski
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

epcis:
  output:
    directory: ./output/events
  schema:
    path: classpath:xsd/EPCglobal-epcis-1_2.xsd
